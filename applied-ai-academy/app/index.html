<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>AI Foundations Handbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Applied AI Academy — AI Foundations Handbook, Level 01. Interactive edition of Chapter 01: Understanding Artificial Intelligence.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a handbook reader. Contents rail on the left, one reading column (~68ch) on the right. */
:root{
  --paper:#F5F7FA; --surface:#FFFFFF; --surface-2:#ECF0F6; --ink:#14203A; --ink-2:#434F69; --muted:#68728B; --line:#D7DDE8;
  --accent:#2C4EC4; --accent-soft:#E5EBFB; --on-accent:#FFFFFF;
  --ochre:#A8661A; --ochre-soft:#FBF0E1;
  --sage:#2C7356; --sage-soft:#E3F1EA;
  --rose:#AC3549; --rose-soft:#FBE8EB;
  --winter:#2F6F9C; --winter-soft:#E2EEF7;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Literata", Georgia, "Times New Roman", serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --f-ui:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1320; --surface:#151B2B; --surface-2:#1C2437; --ink:#E6EAF3; --ink-2:#B4BDD1; --muted:#8992AA; --line:#2A3249;
  --accent:#93A9F6; --accent-soft:#1E2A4E; --on-accent:#0E1320;
  --ochre:#E2A552; --ochre-soft:#2C2214; --sage:#6FC79F; --sage-soft:#14291F; --rose:#F08C9C; --rose-soft:#321A20;
  --winter:#86BCE2; --winter-soft:#14263A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1320; --surface:#151B2B; --surface-2:#1C2437; --ink:#E6EAF3; --ink-2:#B4BDD1; --muted:#8992AA; --line:#2A3249;
  --accent:#93A9F6; --accent-soft:#1E2A4E; --on-accent:#0E1320;
  --ochre:#E2A552; --ochre-soft:#2C2214; --sage:#6FC79F; --sage-soft:#14291F; --rose:#F08C9C; --rose-soft:#321A20;
  --winter:#86BCE2; --winter-soft:#14263A; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.65}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.2;text-wrap:balance;color:var(--ink)}
h1{font-size:clamp(30px,5vw,42px);font-weight:700;margin:6px 0 14px;letter-spacing:-.01em}
h2{font-size:25px;font-weight:700;margin:44px 0 10px}
h3{font-size:19px;font-weight:700;margin:28px 0 6px}
p{margin:0 0 14px}
ul,ol{margin:0 0 16px;padding-left:22px}
li{margin:4px 0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lede{font-size:19px;color:var(--ink-2)}
button{font:inherit;cursor:pointer}

/* ---- shell ---- */
.app{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:22px 18px 28px;font-family:var(--f-ui);font-size:14px;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink)}
.brand-mark{width:34px;height:34px;flex:none}
.brand b{display:block;font-family:var(--f-display);font-size:16px;line-height:1.1}
.brand span{font-size:12px;color:var(--muted)}
.prog{display:grid;gap:6px}
.prog-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.nav{display:grid;gap:2px}
.nav-h{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 8px 4px}
.nav a{display:flex;gap:10px;align-items:baseline;padding:7px 8px;border-radius:7px;color:var(--ink-2);text-decoration:none;line-height:1.3}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav .n{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);min-width:24px}
.nav .tick{margin-left:auto;color:var(--sage);font-size:13px}
.rail-foot{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}
.chip-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:99px;padding:6px 12px;font-size:13px;font-family:var(--f-ui)}
.chip-btn:hover{border-color:var(--accent);color:var(--ink)}
.app>div{min-width:0}
.topbar{display:none}
.content{padding-block:40px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.col{max-width:720px;margin:0 auto}
.wide{max-width:1000px;margin:0 auto}
main:focus{outline:none}
.scrim{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line);align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-family:var(--f-ui)}
  .topbar .brand b{font-size:15px}
  .rail{position:fixed;z-index:50;left:0;top:0;bottom:0;width:min(86vw,300px);height:auto;padding-top:calc(22px + env(safe-area-inset-top,0px));padding-left:max(18px,env(safe-area-inset-left,0px));transform:translateX(-102%);transition:transform .25s}
  .app.open .rail{transform:none;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .app.open .scrim{display:block;position:fixed;inset:0;z-index:45;background:rgba(10,14,25,.45)}
  .content{padding-block:24px 64px}
}
.menu-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:14px}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:11px 18px;font-family:var(--f-ui);font-size:15px;font-weight:600;text-decoration:none;border:1px solid transparent}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--accent)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* ---- home ---- */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;align-items:center;padding-bottom:36px;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(36px,6vw,56px);line-height:1.02}
.hero-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;font-family:var(--f-ui);font-size:14px;display:grid;gap:14px}
.hero-card .big{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat-row{display:flex;gap:22px;flex-wrap:wrap}
.stat-row div{display:grid}
.stat-row small{color:var(--muted)}
@media (max-width:760px){.hero{grid-template-columns:1fr;gap:24px}}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:20px}
@media (max-width:860px){.levels{grid-template-columns:1fr}}
.level{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:10px;align-content:start;font-family:var(--f-ui);font-size:14.5px}
.level h3{margin:0;font-size:20px}
.level ol{list-style:none;padding:0;margin:0;display:grid;gap:2px}
.level li{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);margin:0}
.level li .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);min-width:22px}
.level li a{color:var(--ink);font-weight:600}
.status{margin-left:auto;font-size:11.5px;font-family:var(--f-mono);letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:99px;white-space:nowrap}
.st-live{background:var(--sage-soft);color:var(--sage)}
.st-dev{background:var(--surface-2);color:var(--muted)}
.features{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 28px;margin-top:16px}
@media (max-width:700px){.features{grid-template-columns:1fr}}
.features h3{margin:0 0 4px;font-size:17px}
.features p{margin:0;color:var(--ink-2);font-size:16px}

/* ---- lesson furniture ---- */
.lesson-head{margin-bottom:26px}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--f-ui);font-size:13.5px;color:var(--muted)}
.box{border:1px solid var(--line);border-radius:12px;padding:16px 18px 6px;margin:22px 0;background:var(--surface)}
.box>.tag{display:inline-block;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:99px;margin-bottom:10px}
.box.closer{background:var(--accent-soft);border-color:transparent}.box.closer>.tag{background:var(--surface);color:var(--accent)}
.box.case{background:var(--ochre-soft);border-color:transparent}.box.case>.tag{background:var(--surface);color:var(--ochre)}
.box.myth{background:var(--rose-soft);border-color:transparent}.box.myth>.tag{background:var(--surface);color:var(--rose)}
.box.think{background:var(--sage-soft);border-color:transparent}.box.think>.tag{background:var(--surface);color:var(--sage)}
.box.sa{background:var(--surface-2);border-color:transparent}.box.sa>.tag{background:var(--surface);color:var(--ink-2)}
.box h4{margin:0 0 8px;font-size:17px}
.ev{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:99px;vertical-align:2px;white-space:nowrap}
.ev-e{background:var(--sage-soft);color:var(--sage)}
.ev-d{background:var(--ochre-soft);color:var(--ochre)}
.ev-m{background:var(--winter-soft);color:var(--winter)}
.key{font-family:var(--f-display);font-size:21px;line-height:1.35;font-weight:500;margin:26px 0;padding:18px 0;border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}
.tbl{overflow-x:auto;margin:16px 0 22px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-family:var(--f-ui);font-size:14.5px;line-height:1.45;background:var(--surface)}
th,td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
th{background:var(--surface-2);font-weight:600;color:var(--ink)}
tr:last-child td{border-bottom:0}
figure{margin:24px 0}
.fig{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.fig svg{display:block;width:100%;min-width:540px;height:auto}
figcaption{font-family:var(--f-ui);font-size:13.5px;color:var(--muted);margin-top:8px}
svg text{font-family:var(--f-ui)}
.d-box{fill:var(--surface-2);stroke:var(--line);stroke-width:1.5}
.d-acc{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.d-ochre{fill:var(--ochre-soft);stroke:var(--ochre);stroke-width:1.5}
.d-sage{fill:var(--sage-soft);stroke:var(--sage);stroke-width:1.5}
.d-t{fill:var(--ink);font-size:15px;font-weight:600}
.d-s{fill:var(--ink-2);font-size:12.5px}
.d-m{fill:var(--muted);font-size:11.5px;letter-spacing:.06em}
.d-line{stroke:var(--muted);stroke-width:1.6;fill:none}
.d-arrow{fill:var(--muted)}
.d-bar{fill:var(--accent)}
.d-bar2{fill:var(--line)}
.g{border-bottom:1.5px dotted var(--accent);cursor:help}
.pop{position:absolute;z-index:70;max-width:300px;background:var(--ink);color:var(--paper);font-family:var(--f-ui);font-size:13.5px;line-height:1.45;padding:10px 12px;border-radius:9px;box-shadow:0 8px 26px rgba(0,0,0,.25)}
.pop b{display:block;margin-bottom:2px}

/* ---- questions ---- */
.check{margin:40px 0 10px;padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.check h2{margin:0 0 4px;font-size:21px}
.q{border:0;margin:18px 0 0;padding:0;min-width:0}
.q legend{font-family:var(--f-ui);font-weight:600;font-size:15.5px;line-height:1.45;margin-bottom:8px;padding:0}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:9px;padding:10px 12px;font-family:var(--f-ui);font-size:14.5px;line-height:1.4}
.opt:hover{border-color:var(--accent)}
.opt .l{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px}
.opt.right{border-color:var(--sage);background:var(--sage-soft)}
.opt.wrong{border-color:var(--rose);background:var(--rose-soft)}
.opt input{margin-top:3px;accent-color:var(--accent)}
.fb{font-family:var(--f-ui);font-size:14px;margin:8px 0 0;min-height:1px}
.fb.ok{color:var(--sage)} .fb.no{color:var(--rose)}
.fb span{color:var(--ink-2)}

/* ---- labs ---- */
.lab{margin:28px 0;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.lab-head{padding:16px 18px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.lab-head h3{margin:2px 0 4px}
.lab-head p{margin:0;font-family:var(--f-ui);font-size:14px;color:var(--ink-2)}
.lab-body{padding:16px 18px;font-family:var(--f-ui);font-size:14.5px}
.sort-list{display:grid;gap:10px}
.sort-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.sort-item .what{font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--ink-2);padding:6px 10px;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.sort-item .why{grid-column:1/-1;font-size:13.5px;color:var(--ink-2)}
.sort-item.ok{border-color:var(--sage)} .sort-item.no{border-color:var(--rose)}
@media (max-width:560px){.sort-item{grid-template-columns:1fr}}
.lab-foot{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:14px 18px;border-top:1px solid var(--line);font-family:var(--f-ui);font-size:14px}
.score{font-weight:700;font-variant-numeric:tabular-nums}
.sent-list{display:grid;gap:8px}
.sent{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:9px;padding:10px 12px;font-family:var(--f-body);font-size:16px;line-height:1.5}
.sent[aria-pressed="true"]{border-color:var(--ochre);background:var(--ochre-soft)}
.sent.ok{border-color:var(--sage)} .sent.no{border-color:var(--rose)}
.sent small{display:block;font-family:var(--f-ui);font-size:13px;color:var(--ink-2);margin-top:6px}
.day-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:560px){.day-grid{grid-template-columns:1fr}}
.day-grid label{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--paper)}
.day-grid input{accent-color:var(--accent);margin-top:3px}
.day-grid small{display:block;color:var(--muted)}
.mix{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.mix span{background:var(--surface-2);border-radius:99px;padding:3px 10px;font-size:13px}

/* ---- timeline ---- */
.tl-filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px;font-family:var(--f-ui)}
.tl-filters button{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:99px;padding:6px 13px;font-size:13.5px}
.tl-filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tl{list-style:none;padding:0;margin:0;position:relative}
.tl::before{content:"";position:absolute;left:118px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl li{display:grid;grid-template-columns:104px minmax(0,1fr);gap:30px;margin:0 0 18px;position:relative}
.tl li::before{content:"";position:absolute;left:113px;top:8px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl li.winter::before{border-color:var(--winter);background:var(--winter-soft)}
.tl li.symbolic::before{border-color:var(--ochre)}
.tl .yr{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);text-align:right;padding-top:3px;line-height:1.35}
.tl .ev-body{font-family:var(--f-ui);font-size:14.5px;line-height:1.5}
.tl .ev-body b{display:block;font-size:15.5px;margin-bottom:2px}
.tl li.winter .ev-body{background:var(--winter-soft);border-radius:10px;padding:10px 12px}
.tl .kinds{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tl .kinds span{font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 7px}
@media (max-width:560px){.tl::before{left:8px}.tl li{grid-template-columns:1fr;gap:2px;padding-left:28px}.tl li::before{left:3px}.tl .yr{text-align:left}}

/* ---- lesson nav ---- */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:40px}
.pager a,.pager button{display:grid;gap:2px;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:14px 16px;font-family:var(--f-ui);text-align:left}
.pager a:hover,.pager button:hover{border-color:var(--accent)}
.pager small{color:var(--muted);font-size:12.5px}
.pager .next{text-align:right;grid-column:2}
.pager .next.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.pager .next.primary small{color:inherit;opacity:.8}
.done-note{font-family:var(--f-ui);font-size:14px;color:var(--sage);margin-top:14px}

/* ---- chapter overview ---- */
.lesson-list{list-style:none;padding:0;margin:16px 0;display:grid;gap:10px}
.lesson-list a{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-decoration:none;color:var(--ink);font-family:var(--f-ui)}
.lesson-list a:hover{border-color:var(--accent)}
.lesson-list .n{font-family:var(--f-mono);font-size:15px;color:var(--accent)}
.lesson-list b{display:block;font-size:16px}
.lesson-list small{color:var(--muted);font-size:13px}
.lesson-list .st{font-size:13px;color:var(--muted)}
.lesson-list .st.d{color:var(--sage);font-weight:600}
.objs{counter-reset:o;list-style:none;padding:0}
.objs li{counter-increment:o;display:grid;grid-template-columns:34px minmax(0,1fr);margin:8px 0}
.objs li::before{content:counter(o,decimal-leading-zero);font-family:var(--f-mono);font-size:13px;color:var(--muted);padding-top:3px}

/* ---- assessment ---- */
.sec{margin:36px 0}

<template id="t-lesson-1-1">
<p class="lede">Before we can ask whether a machine is intelligent, we need a clearer idea of what intelligence is. It turns out to be harder to pin down than it looks.</p>

<p>Picture an ordinary moment. You are driving when the car in front of you brakes suddenly. In under a second you notice the brake lights, judge the gap between the cars, remember how your own car handles, decide how hard to brake, and press the pedal.</p>
<p>That moment draws on several abilities at once:</p>
<ul>
<li>taking in information from your surroundings (<strong>perception</strong>);</li>
<li>making sense of what is happening;</li>
<li>recalling relevant experience (<strong>memory</strong>);</li>
<li>weighing up possible outcomes (<strong>reasoning</strong>);</li>
<li>choosing a response (<strong>decision-making</strong>);</li>
<li>carrying it out (<strong>action</strong>).</li>
</ul>
<p>Psychologists call these <strong>cognitive abilities</strong>: the mental processes we use to gain knowledge and put it to work.</p>

<h2>No single definition</h2>
<p>Intelligence has no universally agreed definition. Psychologists, neuroscientists, philosophers and computer scientists each approach it differently. When the researchers Shane Legg and Marcus Hutter collected and compared more than 70 published definitions, they proposed a short summary that works for people and machines alike: intelligence <em>"measures an agent's ability to achieve goals in a wide range of environments."</em> <span class="ev ev-d">Debated</span></p>
<p>Notice the phrase <em>a wide range of environments</em>. A system that is brilliant at one narrow task and helpless everywhere else is, by this measure, not very intelligent. Keep that idea in mind. It will matter when we look at today's AI.</p>

<h3>Components of intelligent behaviour</h3>
<div class="tbl"><table>
<thead><tr><th>Ability</th><th>Everyday example</th></tr></thead>
<tbody>
<tr><td>Reasoning</td><td>Working out why a machine has stopped operating</td></tr>
<tr><td>Learning</td><td>Driving better as you gain experience</td></tr>
<tr><td>Memory</td><td>Remembering instructions someone gave you</td></tr>
<tr><td>Perception</td><td>Recognising a familiar face in a crowd</td></tr>
<tr><td>Language</td><td>Understanding and explaining ideas</td></tr>
<tr><td>Problem-solving</td><td>Finding another route when a road is closed</td></tr>
<tr><td>Adaptability</td><td>Adjusting to an unfamiliar workplace</td></tr>
</tbody></table></div>

<h2>The intelligence loop</h2>
<p>The braking example follows a pattern that AI researchers use to describe any intelligent system. An <span class="g" data-g="agent">agent</span> <strong>perceives</strong> its environment, <strong>decides</strong> what to do and <strong>acts</strong>. Its action changes the environment, and the loop starts again.</p>
<figure>
<div class="fig"><svg viewBox="0 0 660 230" role="img" aria-label="Diagram: perceive, decide and act in a loop. The action changes the environment, which is perceived again.">
<defs><marker id="ah1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="d-arrow"/></marker></defs>
<rect x="20" y="30" width="170" height="92" rx="12" class="d-acc"/>
<text x="40" y="62" class="d-t">Perceive</text><text x="40" y="86" class="d-s">See the brake lights</text><text x="40" y="104" class="d-s">and the gap closing</text>
<rect x="245" y="30" width="170" height="92" rx="12" class="d-ochre"/>
<text x="265" y="62" class="d-t">Decide</text><text x="265" y="86" class="d-s">Brake now, and how</text><text x="265" y="104" class="d-s">hard?</text>
<rect x="470" y="30" width="170" height="92" rx="12" class="d-sage"/>
<text x="490" y="62" class="d-t">Act</text><text x="490" y="86" class="d-s">Press the pedal</text><text x="490" y="104" class="d-s">firmly</text>
<path d="M190 76 H241" class="d-line" marker-end="url(#ah1)"/>
<path d="M415 76 H466" class="d-line" marker-end="url(#ah1)"/>
<path d="M555 122 V178 H105 V126" class="d-line" marker-end="url(#ah1)"/>
<text x="330" y="200" text-anchor="middle" class="d-m">THE ENVIRONMENT CHANGES · THE LOOP REPEATS</text>
</svg></div>
<figcaption>A driver, a spam filter and a self-driving car can all be described with this loop.</figcaption>
</figure>

<h2>Does a machine need to think like us?</h2>
<p>Not necessarily. A computer can sort thousands of photographs far faster than a person could look through them. A navigation app can compare routes using live traffic data from thousands of road users. Both show capabilities we associate with intelligence, even though what happens inside them is very different from human thinking.</p>
<p>That gap, between <em>doing</em> an intelligent-looking task and <em>thinking</em> the way a person does, runs through this whole chapter.</p>

<div class="box closer"><span class="tag">Look closer</span>
<h4>Moravec's paradox: easy for us, hard for machines</h4>
<p>In the 1980s, the roboticist Hans Moravec pointed out something surprising. Tasks people find hard, such as advanced mathematics or chess, turned out to be relatively easy for computers. Tasks people find effortless, such as recognising a friend across a room, walking over rough ground or picking up an egg without breaking it, turned out to be very hard. <span class="ev ev-e">Established</span></p>
<p>One explanation is that perception and movement were refined over hundreds of millions of years of evolution. We do them without noticing, so we underestimate how complex they are. Abstract reasoning is recent in evolutionary terms, and we do it slowly and deliberately, so it <em>feels</em> difficult.</p>
<p><strong>Why it matters:</strong> you cannot judge how capable an AI system is by how impressive its task looks to a human. A system that writes a fluent essay can still fail at something a child finds simple.</p>
</div>

<div class="box think"><span class="tag">Think about it</span>
<p>List three things you did this morning without thinking about them. Which would be hardest for a robot? Why?</p>
</div>
<div data-check></div>
</template>

<template id="t-lesson-1-2">
<p class="lede">"AI" is used to describe everything from a phone camera to a chatbot. This lesson gives you precise language for what AI is and how its parts fit together.</p>

<p><strong>Artificial intelligence (AI)</strong> is a field of computer science concerned with building systems that can perform tasks associated with intelligent behaviour. Examples include:</p>
<ul>
<li>recognising speech and identifying objects in images;</li>
<li>understanding, translating and generating language;</li>
<li>spotting patterns and making predictions;</li>
<li>making recommendations and supporting decisions;</li>
<li>solving certain kinds of problems, such as planning a route.</li>
</ul>

<h2>Unpacking the name</h2>
<p><strong>Artificial</strong> means made by people rather than occurring naturally.</p>
<p><strong>Intelligence</strong>, as a working definition for this handbook, is the ability to acquire and apply knowledge, recognise patterns, reason and solve problems.</p>
<p>Put together, <strong>artificial intelligence</strong> is the design of computer systems that perform tasks associated with intelligent behaviour.</p>

<div class="box closer"><span class="tag">Look closer</span>
<h4>How experts define AI</h4>
<p><strong>A founder's definition.</strong> John McCarthy, who introduced the term in 1955, later described AI as <em>"the science and engineering of making intelligent machines, especially intelligent computer programs."</em></p>
<p><strong>A policy definition.</strong> In November 2023 the OECD, an international organisation whose definitions many governments use, updated its definition of an <em>AI system</em>:</p>
<p><em>"An AI system is a machine-based system that, for explicit or implicit objectives, infers, from the input it receives, how to generate outputs such as predictions, content, recommendations, or decisions that can influence physical or virtual environments. Different AI systems vary in their levels of autonomy and adaptiveness after deployment."</em></p>
<p>The key word is <strong>infers</strong>. An AI system works out its output from what it receives, instead of only following a fixed rule. McCarthy defines a <em>field of study</em>. The OECD defines a <em>type of system</em>, so that laws such as the EU AI Act can identify what they apply to.</p>
</div>

<h2>The AI family map</h2>
<p>Several terms you will meet constantly are related like nested circles. Learn this picture now and much of what you read about AI becomes easier to follow.</p>
<figure>
<div class="fig"><svg viewBox="0 0 640 400" role="img" aria-label="Nested regions: artificial intelligence contains machine learning, which contains deep learning, which contains generative AI and large language models.">
<rect x="2" y="2" width="636" height="396" rx="18" class="d-box"/>
<text x="24" y="34" class="d-t">Artificial intelligence</text>
<text x="24" y="56" class="d-s">Rules, search, planning, learning: any technique for intelligent tasks</text>
<rect x="40" y="74" width="560" height="306" rx="16" class="d-ochre"/>
<text x="62" y="106" class="d-t">Machine learning</text>
<text x="62" y="128" class="d-s">Systems that learn patterns from data</text>
<rect x="80" y="146" width="480" height="216" rx="14" class="d-sage"/>
<text x="102" y="178" class="d-t">Deep learning</text>
<text x="102" y="200" class="d-s">Machine learning with many-layered neural networks</text>
<rect x="120" y="218" width="400" height="126" rx="12" class="d-acc"/>
<text x="142" y="250" class="d-t">Generative AI</text>
<text x="142" y="272" class="d-s">Models that create text, images, audio and code</text>
<text x="142" y="300" class="d-s">including large language models (LLMs)</text>
<text x="142" y="324" class="d-m">E.G. CHAT ASSISTANTS, IMAGE GENERATORS</text>
</svg></div>
<figcaption>Every large language model uses deep learning. All deep learning is machine learning, and all machine learning is AI. The reverse is not true.</figcaption>
</figure>
<p>A chess program that searches through moves using hand-written rules is AI, but not <span class="g" data-g="ml">machine learning</span>. A spam filter can use machine learning without <span class="g" data-g="dl">deep learning</span>. "Generative AI" describes what a system <em>does</em> (it creates content) rather than one technique. Today's leading generative systems are built with deep learning, which is why they sit in the centre. <span class="ev ev-e">Established</span></p>

<h2>AI is a field, not a product</h2>
<p>AI is not a single application. It is a field containing many methods, models and applications:</p>
<ul>
<li>a <strong>facial recognition</strong> system identifies or verifies faces;</li>
<li>a <strong>translation</strong> system processes language;</li>
<li>a <strong>recommendation engine</strong> suggests products, music or videos;</li>
<li>a <strong>generative AI</strong> system produces new text, images or other content.</li>
</ul>
<p>All of these belong to AI, but they do not work in the same way.</p>

<h2>Narrow AI and general AI</h2>
<p><strong><span class="g" data-g="narrow">Narrow AI</span></strong> refers to systems built for particular tasks. Every AI system in use today is generally considered narrow, although modern language models handle a far broader range of tasks than earlier systems. <span class="ev ev-e">Established</span></p>
<p><strong><span class="g" data-g="agi">Artificial general intelligence (AGI)</span></strong> refers to a hypothetical system that could learn and perform the full range of intellectual tasks a person can. There is no agreed definition of AGI and no agreed test for it. Researchers disagree sharply about whether, when and how it might be built. <span class="ev ev-d">Debated</span></p>

<div class="box myth"><span class="tag">Myth vs fact</span>
<p><strong>Myth:</strong> If a product says "AI-powered", it must be learning and adapting.</p>
<p><strong>Fact:</strong> "AI" is used loosely in marketing. Some products labelled AI follow fixed scripts or simple rules. Ask what the system actually does: does it infer from data, or follow a set procedure?</p>
</div>

<div class="box think"><span class="tag">Think about it</span>
<p>When you see a headline saying AGI is "two years away" or "impossible", ask three questions. How are they defining AGI? What evidence do they offer? Do they have a financial or reputational interest in the answer?</p>
</div>
<div data-check></div>
</template>

<template id="t-lesson-1-3">
<p class="lede">This is the most important idea in the chapter. Most of modern AI rests on one shift: from writing rules by hand to learning them from examples.</p>

<h2>Two ways to make a computer do something</h2>
<p><strong>Traditional programming: you write the rules.</strong> A programmer studies the problem, writes explicit instructions, and the computer follows them exactly.</p>
<p><strong>Machine learning: you supply examples, and the system finds the rules.</strong> The programmer gathers many examples where the right answer is already known. A learning algorithm adjusts a mathematical <span class="g" data-g="model">model</span> until it reproduces those answers as closely as it can. The model can then be used on new cases it has never seen.</p>

<h2>Worked example: filtering spam</h2>
<div class="tbl"><table>
<thead><tr><th></th><th>Rule-based approach</th><th>Machine-learning approach</th></tr></thead>
<tbody>
<tr><td><strong>How it is built</strong></td><td>Staff write rules: "If the subject contains FREE MONEY, mark as spam."</td><td>The system studies many emails already labelled "spam" or "not spam" and learns which features tend to signal spam.</td></tr>
<tr><td><strong>Strength</strong></td><td>Transparent. You can read exactly why an email was blocked.</td><td>Finds patterns nobody wrote down, and can be retrained as spam changes.</td></tr>
<tr><td><strong>Weakness</strong></td><td>Spammers change wording ("FR3E M0NEY"), and every new trick needs a new rule.</td><td>Needs plenty of good labelled data, makes mistakes nobody predicted, and can be hard to explain.</td></tr>
<tr><td><strong>Who decides what counts as spam?</strong></td><td>The person who wrote the rules.</td><td>The people who labelled the training examples. Their judgement becomes part of the system.</td></tr>
</tbody></table></div>
<p>Look at the last row. It explains where bias in AI comes from, which you will meet in Lesson 1.8. <strong>In machine learning, human judgement does not disappear. It moves into the data.</strong></p>

<h2>A business example</h2>
<p>A supermarket wants to recommend products. A traditional program might follow a rule someone wrote: "If a customer buys product A, show product B."</p>
<p>A machine-learning approach analyses purchase histories from thousands of customers and finds relationships nobody wrote as rules, such as items that are often bought together. One established technique for this is called <em>association rule mining</em>. The system then uses those patterns to make suggestions.</p>
<p>Traditional programs can make recommendations too. The difference is that machine learning <em>learns</em> patterns from data and uses them to predict.</p>

<h2>When to use which</h2>
<div class="tbl"><table>
<thead><tr><th>Rules work best when…</th><th>Learning works best when…</th></tr></thead>
<tbody>
<tr><td>the logic is clear and stable (for example, adding 15% VAT to a price)</td><td>the pattern is too complex or fuzzy to write down (for example, recognising a face)</td></tr>
<tr><td>every decision must be fully explainable</td><td>the situation keeps changing (for example, new spam tricks)</td></tr>
<tr><td>there is little data</td><td>there are many good examples to learn from</td></tr>
</tbody></table></div>

<p class="key">Traditional programs follow rules people wrote. Machine-learning systems follow patterns they found in examples people chose.</p>

<template id="t-lesson-1-4">
<p class="lede">Artificial intelligence did not appear when ChatGPT became popular. It grew out of an old question, and today it is driven by two quite different motivations.</p>

<p>People have always built tools to save effort, improve accuracy and handle harder problems. The Industrial Revolution mechanised manufacturing. Electronic computers, from the 1940s onwards, made it possible to process information at speeds no person could match.</p>
<p>Researchers soon began to ask whether computers could do more than follow fixed instructions. Could they learn from information? Recognise patterns? Solve problems? Understand language?</p>

<h2>Motivation 1: understanding intelligence</h2>
<p>The founders of the field were driven mainly by a scientific question. The 1955 proposal for the Dartmouth summer workshop, which gave the field its name, set out the working assumption that <em>"every aspect of learning or any other feature of intelligence can in principle be so precisely described that a machine can be made to simulate it."</em> <span class="ev ev-e">Established</span></p>
<p>In other words, one way to understand intelligence is to try to build it. That assumption is still debated, as you will see in Lesson 1.7.</p>

<h2>Motivation 2: building useful tools</h2>
<p>Today most AI development is driven by practical goals:</p>
<ol>
<li><strong>Automating complex tasks.</strong> Some work involves large amounts of repetitive information processing that AI can take on.</li>
<li><strong>Supporting decisions.</strong> AI can analyse large datasets and surface patterns that help people decide.</li>
<li><strong>Handling information at scale.</strong> Organisations produce more documents, messages and records than people can read. AI can classify, summarise and search them.</li>
<li><strong>Finding patterns.</strong> AI can detect relationships in data that people would struggle to spot by hand.</li>
<li><strong>Extending what is possible.</strong> In areas such as protein-structure prediction, AI tackles problems that were previously out of reach.</li>
</ol>

<h2>Augmentation or automation?</h2>
<p>Organisations make a design choice when they introduce AI. They can use it to <strong><span class="g" data-g="augment">augment</span></strong> people, helping them work better, or to <strong><span class="g" data-g="automate">automate</span></strong> tasks, doing them without a person involved. Both happen in practice.</p>
<div class="tbl"><table>
<thead><tr><th></th><th>Augmentation</th><th>Automation</th></tr></thead>
<tbody>
<tr><td>Healthcare</td><td>A system highlights areas of concern on a scan, and a radiologist makes the diagnosis</td><td>A system issues a screening result directly, with defined referral rules (see Lesson 1.6)</td></tr>
<tr><td>Customer service</td><td>AI drafts a reply and an agent checks and sends it</td><td>A chatbot answers customers directly</td></tr>
<tr><td>Finance</td><td>AI flags unusual transactions for an analyst to review</td><td>Low-risk transactions are approved automatically</td></tr>
</tbody></table></div>
<p>Even when a task is automated, people remain responsible for the system: for how it was designed, tested and monitored, and for what happens when it gets something wrong. The most valuable uses of AI often combine computing power with human knowledge, judgement and accountability.</p>

<div class="box think"><span class="tag">Think about it</span>
<p>Think of your own work or studies. Name one task you would like AI to <em>augment</em> and one you would be comfortable having it <em>automate</em>. What makes them different?</p>
</div>

<p class="lede">AI's history is not a straight line of breakthroughs. It is a story of two competing traditions, big promises, two "winters" and a recent surge.</p>

<h2>Two traditions</h2>
<div class="tbl"><table>
<thead><tr><th></th><th>Rules and logic (symbolic AI)</th><th>Learning from data</th></tr></thead>
<tbody>
<tr><td><strong>Core idea</strong></td><td>Represent knowledge as symbols and rules, then reason with them</td><td>Let a system learn patterns from examples</td></tr>
<tr><td><strong>Examples</strong></td><td>Expert systems, classic chess engines</td><td>Neural networks, image recognition, large language models</td></tr>
<tr><td><strong>Strength</strong></td><td>Explainable and precise</td><td>Copes with messy real-world data such as images, speech and everyday language</td></tr>
<tr><td><strong>Weakness</strong></td><td>Brittle when the world does not fit the rules, and rules are costly to write</td><td>Needs lots of data and computing power, and its reasoning is hard to inspect</td></tr>
<tr><td><strong>Dominant</strong></td><td>Roughly 1950s–1980s</td><td>Roughly 2010s–today</td></tr>
</tbody></table></div>
<p>Many researchers now work on <strong>hybrid</strong> systems that combine the two. Which approach leads in future is <span class="ev ev-d">Debated</span>.</p>

<h2>Timeline</h2>
<p>Use the filters to follow one tradition at a time.</p>
<div data-widget="timeline"></div>

<h2>Moments worth understanding</h2>
<h3>Turing's question (1950)</h3>
<p>The British mathematician Alan Turing opened his paper <em>Computing Machinery and Intelligence</em> with the question "Can machines think?". He then replaced it with a test he could actually carry out, the <span class="g" data-g="turing">imitation game</span>: can a human judge, conversing by text, tell the machine from a person? Turing deliberately judged the machine by its <em>behaviour</em>, not by what happens inside it. Lesson 1.7 returns to this choice.</p>

<h3>Expert systems and their limits (1970s–1980s)</h3>
<p><span class="g" data-g="expert">Expert systems</span> captured specialist knowledge as hundreds or thousands of if–then rules. MYCIN, developed at Stanford in the 1970s, recommended antibiotics for certain infections. In the 1980s, companies adopted systems such as XCON, which configured computer orders. Their weakness became known as the <strong>knowledge-acquisition bottleneck</strong>: getting rules out of experts' heads, and keeping them up to date, was slow and expensive.</p>

<div class="box case"><span class="tag">Two victories, two kinds of AI</span>
<p><strong>1997, Deep Blue vs Garry Kasparov (chess).</strong> IBM's machine won the rematch 3½–2½, after Kasparov had won their first match in 1996. Deep Blue relied on custom hardware searching well over 100 million positions per second, guided by an evaluation function tuned with input from chess experts. It did <em>not</em> learn chess from data. It was a triumph of search and engineering. <span class="ev ev-e">Established</span></p>
<p><strong>2016, AlphaGo vs Lee Sedol (Go).</strong> Go has far too many possible positions to search by brute force. DeepMind's AlphaGo combined deep neural networks, trained on human games and then on games against itself, with tree search. It beat Lee Sedol, one of the strongest players of the era, 4–1. <span class="ev ev-e">Established</span></p>
<p><strong>The lesson:</strong> two famous game victories, achieved in fundamentally different ways. "AI" covers both.</p>
</div>

<h3>The deep-learning breakthrough (2012)</h3>
<p>At the 2012 ImageNet image-recognition challenge, a neural network called AlexNet achieved a top-5 error of about <strong>15.3%</strong>, against about <strong>26.2%</strong> for the next-best entry. (Top-5 error is the share of images where the correct label was not among the model's five best guesses.) It was trained on graphics processing units (<span class="g" data-g="gpu">GPUs</span>), which then became standard hardware for AI.</p>

<h3>The transformer and generative AI (2017–2022)</h3>
<p>In 2017, Google researchers introduced the <strong>transformer</strong> architecture, the design underlying today's large language models. The "T" in GPT stands for transformer. On 30 November 2022, OpenAI released ChatGPT, and millions of people began talking to a large language model directly. Other organisations quickly released assistants, image generators and coding tools of their own.</p>

<h2>Three lessons from history</h2>
<ol>
<li><strong>Progress comes in waves.</strong> Twice, high expectations were followed by <span class="g" data-g="winter">AI winters</span>: periods of reduced funding and interest when results fell short. The winters are <span class="ev ev-e">Established</span>. Whether today's boom continues, levels off or corrects is an open question, and predictions about it are opinion.</li>
<li><strong>Ideas often wait for hardware and data.</strong> Neural networks were proposed in the 1940s and 1950s but became dominant only after 2012, once large datasets and GPU computing became available.</li>
<li><strong>The meaning of "AI" keeps moving.</strong> Once a technique works reliably (route planning, spell-checking, spam filtering), people tend to stop calling it AI. This is often called the <strong>AI effect</strong>. Much of the AI around you no longer carries the label.</li>
</ol>

<template id="t-lesson-1-6">
<p class="lede">You probably used AI several times today without opening an "AI app". Much of it runs quietly in the background.</p>

<div data-widget="ai-day"></div>

<h2>Smartphones</h2>
<p>Face unlock, predictive text, voice assistants, camera processing (sharpening night shots or blurring backgrounds), spam-call detection and photo search ("show me pictures of the beach") all use machine learning. When your keyboard suggests the next word, a model is predicting what you are likely to type from patterns in language.</p>

<h2>Banking and financial services</h2>
<p>Banks use machine learning to spot potentially fraudulent transactions, assess risk and support customer service. If a payment looks very different from your usual spending, the system may flag it and ask you to confirm. A flag is <strong>not proof of fraud</strong>. It means the system found something unusual enough to check.</p>

<h2>Entertainment and social media</h2>
<p>Recommendation systems decide what appears next in your feed or playlist. They weigh your viewing history, what you interacted with, what similar users enjoyed and the characteristics of the content itself. The suggestions are not random. They are predictions about what will keep you engaged, which is worth keeping in mind.</p>

<h2>Healthcare</h2>
<p>AI can help analyse medical images, process health records, support research and reduce administrative work. Healthcare is high-stakes, so AI outputs need appropriate professional oversight and must never be treated as unquestionable medical advice.</p>
<div class="box case"><span class="tag">Case study</span>
<h4>Screening for diabetic eye disease</h4>
<p>In April 2018, the US Food and Drug Administration authorised <strong>IDx-DR</strong>, the first AI-based device permitted to give a screening result for diabetic retinopathy (diabetes-related damage to the eye) without a specialist interpreting the image. It was designed for primary-care clinics, where eye specialists may not be available. A positive or unclear result refers the patient to an eye-care professional. <span class="ev ev-e">Established</span></p>
<p><strong>Discuss:</strong> how is this different from "AI replacing doctors"? What does the referral step protect against?</p>
</div>

<h2>Business and the workplace</h2>
<p>Picture a small South African business that receives hundreds of customer emails a month. AI tools could help staff sort incoming messages, draft replies, summarise long threads, pull details out of documents, prepare reports and analyse sales data.</p>
<p>Staff still need to review the output, especially where accuracy, customer information or business decisions are involved. Lesson 1.8 explains why, with a real case where a company paid for its chatbot's mistake.</p>

<h2>Education</h2>
<p>Students and teachers use AI to explain difficult concepts, generate practice questions, summarise material, practise languages and plan lessons. Used well, AI can be a patient study partner. Letting it complete assignments you have not understood defeats the purpose of learning. The aim is to learn more, not to skip the learning.</p>

<div class="box sa"><span class="tag">South Africa</span>
<h4>AI and our languages</h4>
<p>South Africa has 12 official languages, including South African Sign Language, recognised in 2023. AI translation and voice tools generally work best in languages with huge amounts of digital text, such as English, and are often weaker in languages with less text online, including many African languages. <span class="ev ev-e">Established</span></p>
<p>Research communities such as <strong>Masakhane</strong>, a grassroots network working on language technology for African languages, are helping to close this gap. When you use an AI tool in isiZulu, Sesotho or Tshivenda, check its output with extra care.</p>
</div>

<p class="lede">Modern AI can explain science, write poetry and debug code. Its answers can sound thoughtful. Does that mean it thinks the way we do?</p>

<h2>What happens inside a chatbot</h2>
<p>Most chat assistants are built on a <span class="g" data-g="llm">large language model (LLM)</span>, a deep-learning model trained on very large amounts of text. In plain terms:</p>
<ol>
<li>Text is split into <span class="g" data-g="token">tokens</span>: chunks that may be whole words, parts of words or punctuation.</li>
<li>The model contains billions of adjustable numbers called <span class="g" data-g="param">parameters</span>. During training, they are adjusted again and again so the model gets better at predicting the next token in a passage.</li>
<li>When you send a message, the model calculates how likely each possible next token is. One is selected, added to the text, and the process repeats, building the reply one token at a time.</li>
<li>Most assistants are then refined using <strong>human feedback</strong>. People rate or compare responses, and the model is adjusted to be more helpful and to follow instructions better.</li>
</ol>
<p><span class="ev ev-e">Established</span></p>

<div class="box closer"><span class="tag">Look closer</span>
<h4>The model is not the whole product</h4>
<p>A chat assistant is usually a model <em>plus</em> other software: safety filters, web search, file reading, calculators and "memory" features. When an assistant gives a correct, up-to-date answer, it may be because it searched the web, not because the model "knew" it. Ask: <em>is this the model, or a tool the product connected it to?</em></p>
</div>

<div class="box myth"><span class="tag">Myth vs fact</span>
<p><strong>Myth:</strong> The chatbot learns from every conversation, so if I correct it, it will remember for everyone.</p>
<p><strong>Fact:</strong> In most deployed systems, the model's parameters are fixed after training. Correcting it in a chat does not change the model. Some products store notes about you <em>outside</em> the model ("memory") and feed them back in later. Depending on the provider and your settings, conversations may also be collected to train <em>future</em> versions, which matters for privacy. <span class="ev ev-m">Varies by product</span></p>
</div>

<h2>The ELIZA effect</h2>
<p>In 1966, Joseph Weizenbaum at MIT built ELIZA, a simple program that imitated a therapist by turning users' statements into questions. It had no grasp of meaning. Weizenbaum was disturbed to find that some people became emotionally attached to it and treated it as if it understood them. The tendency to read understanding into fluent machine output is now called the <span class="g" data-g="eliza">ELIZA effect</span>. Today's systems are vastly more capable than ELIZA, which makes the effect stronger, not weaker.</p>

<h2>Intelligence is not consciousness</h2>
<p><strong>Intelligence</strong> concerns capabilities: learning, reasoning, solving problems and applying knowledge. <strong>Consciousness</strong> concerns subjective experience, the sense that there is something it <em>feels like</em> to be you. A system can perform impressively on tasks without that establishing that it experiences anything. Whether machines could ever be conscious is an open philosophical and scientific question, so avoid unsupported claims either way.</p>

<h2>What is known, and what is debated</h2>
<div class="tbl"><table>
<thead><tr><th>Statement</th><th>Status</th></tr></thead>
<tbody>
<tr><td>LLMs are trained mainly to predict the next token</td><td><span class="ev ev-e">Established</span></td></tr>
<tr><td>LLMs can produce fluent, useful and often correct text across many subjects</td><td><span class="ev ev-e">Established</span></td></tr>
<tr><td>LLMs can produce confident, fluent text that is false</td><td><span class="ev ev-e">Established</span></td></tr>
<tr><td>LLMs have subjective experience</td><td>No established evidence. <span class="ev ev-d">Debated</span></td></tr>
<tr><td>"LLMs are only autocomplete and understand nothing"</td><td><span class="ev ev-d">Debated</span>. Research into what models represent internally (<em>interpretability</em>) is active and unresolved</td></tr>
<tr><td>LLMs understand the world the way humans do</td><td>Not supported by current evidence</td></tr>
</tbody></table></div>

<div class="box closer"><span class="tag">Look closer</span>
<h4>The Chinese Room</h4>
<p>In 1980 the philosopher John Searle proposed a thought experiment. A person who speaks no Chinese sits in a room with a rulebook for manipulating Chinese symbols. Questions in Chinese are passed in. By following the rules, the person passes back fluent answers. To people outside, the room seems to understand Chinese, yet the person inside understands nothing.</p>
<p>Searle argued that running a program is never, by itself, enough for understanding. Many philosophers reject this. Some reply that the <em>whole system</em>, person plus rulebook, might understand. Turing proposed judging machines by behaviour, and Searle argued that behaviour is not enough. The debate remains open. <span class="ev ev-d">Debated</span></p>
</div>

<h2>A simplified comparison</h2>
<div class="tbl"><table>
<thead><tr><th>Human beings</th><th>Current AI systems</th></tr></thead>
<tbody>
<tr><td>Biological brains</td><td>Computer hardware</td></tr>
<tr><td>Learn continuously from varied life experience</td><td>Learn during training, and are usually fixed once released</td></tr>
<tr><td>Have subjective experience</td><td>No established evidence of subjective experience</td></tr>
<tr><td>Understand the world through bodies, senses and social life</td><td>Process inputs using computational models</td></tr>
<tr><td>Exercise judgement and carry responsibility</td><td>Produce outputs that people must evaluate</td></tr>
</tbody></table></div>
<p class="key">An answer that looks intelligent does not mean the system understands the world the way a person does.</p>

<template id="t-lesson-1-8">
<p class="lede">AI offers real gains and real risks. A responsible user understands both, and has a habit for checking what AI produces.</p>

<h2>Opportunities</h2>
<ul>
<li><strong>Productivity.</strong> Routine drafting, sorting and summarising can be done faster.</li>
<li><strong>Access to knowledge.</strong> Conversational tools make complex information easier to explore.</li>
<li><strong>Automation.</strong> Some repetitive processes can run with less manual effort.</li>
<li><strong>Innovation.</strong> AI supports research, engineering, software, education and creative work.</li>
<li><strong>Personalisation.</strong> Services can adapt to individual needs.</li>
</ul>

<h2>Limitations and risks</h2>
<h3>Hallucination</h3>
<p>Generative AI can produce information that sounds plausible but is false or unsupported, such as a court case that does not exist, an invented statistic or a fake quotation. This is commonly called <span class="g" data-g="halluc">hallucination</span>. It is not lying, because the system has no intention to deceive. It is a side-effect of producing likely-sounding text. <span class="ev ev-e">Established</span></p>
<div class="box case"><span class="tag">Case study · South Africa</span>
<h4>Fictitious citations in court</h4>
<p>In <em>Parker v Forsyth</em> (Johannesburg Regional Court, June 2023), a legal team relied on case authorities that turned out not to exist. They had been found using ChatGPT, and the court made a punitive costs order.</p>
<p>In <em>Mavundla v MEC: Co-operative Government and Traditional Affairs, KwaZulu-Natal</em> (High Court, Pietermaritzburg, January 2025), most of the authorities cited in a filing could not be found, and the court referred the matter to the Legal Practice Council. The judgment did not definitively conclude that AI produced them, though commentators noted the pattern matched AI fabrication.</p>
<p><strong>Lesson:</strong> references that look real can be invented. Professionals are accountable for everything they submit.</p>
</div>

<h3>Bias</h3>
<p>Models can reproduce, and sometimes amplify, patterns in their training data or design. Two documented examples:</p>
<ul>
<li>The <strong>Gender Shades</strong> study (2018) tested three commercial systems that classified gender from face photos. Error rates were as low as 0.8% for lighter-skinned men but as high as 34.7% for darker-skinned women. The widely used test datasets were mostly made up of lighter-skinned faces. <span class="ev ev-e">Established</span></li>
<li>In 2018, Reuters reported that Amazon had abandoned an experimental recruiting tool after finding it downgraded CVs associated with women. It had learned from about ten years of hiring patterns in a male-dominated industry.</li>
</ul>
<p>Connect this to Lesson 1.3: in both cases, the bias came from the <em>examples the system learned from</em>.</p>

<h3>Privacy and confidentiality</h3>
<p>Pasting confidential information into an AI service can expose it. In 2023 it was widely reported that Samsung employees had entered confidential material, including source code, into a public chatbot. The company then restricted such tools on its devices.</p>
<div class="box sa"><span class="tag">South Africa</span>
<h4>POPIA and AI tools</h4>
<p>The <strong>Protection of Personal Information Act (POPIA)</strong> governs how organisations collect, use, store and share personal information. Its main provisions have been enforceable since 1 July 2021. Pasting customer emails into an AI tool can count as processing personal information. If the service is hosted abroad, it may also be a transfer outside South Africa, which POPIA section 72 regulates.</p>
<p>In practice: follow your organisation's policy, use approved business tools, remove personal details where you can, and get proper advice if unsure. <em>This is general information, not legal advice.</em></p>
<p><strong>National policy.</strong> The Department of Communications and Digital Technologies released a National AI Policy Framework for consultation in 2024. A Draft National AI Policy was published for public comment in April 2026 and withdrawn later that month. Check the department's website for the current position. <span class="ev ev-m">As at November 2026</span></p>
</div>

<h3>Over-reliance and automation bias</h3>
<p>People tend to over-trust automated systems. They accept outputs without enough checking, or fail to notice when the system is wrong. Researchers call this <span class="g" data-g="autobias">automation bias</span>, and it was documented in aviation and healthcare long before chatbots. The more polished an output looks, the more this matters. Relying on AI without building your own knowledge also weakens your ability to judge its answers.</p>

<h3>Accountability</h3>
<p>Using AI does not transfer responsibility to the AI.</p>
<div class="box case"><span class="tag">Case study</span>
<h4>An airline and its chatbot</h4>
<p>In 2022 a customer asked Air Canada's website chatbot about bereavement fares. It wrongly said the discount could be claimed after travel, although the airline's own policy page said otherwise. In February 2024, British Columbia's Civil Resolution Tribunal rejected the airline's argument that the chatbot was responsible for its own statements, and found Air Canada liable (<em>Moffatt v. Air Canada</em>, 2024 BCCRT 149).</p>
<p><strong>Lesson:</strong> a business answers for what its AI tells customers.</p>
</div>

<h3>Other risks to know about</h3>
<ul>
<li><strong>Misinformation and deepfakes.</strong> Realistic synthetic images, audio and video can be used to deceive. <span class="ev ev-e">Established</span></li>
<li><strong>Intellectual property.</strong> Questions about training on copyrighted work, and who owns AI output, are being argued in courts and legislatures in several countries. <span class="ev ev-m">Emerging</span></li>
<li><strong>Environmental cost.</strong> Training and running large models uses significant electricity, and some data centres use water for cooling. Specific figures change quickly, so check recent, named sources. <span class="ev ev-m">Emerging</span></li>
<li><strong>Work and jobs.</strong> AI is changing tasks within many jobs. Its overall effect on employment is <span class="ev ev-d">Debated</span>, and forecasts vary widely.</li>
</ul>

<h2>Why human judgement matters</h2>
<p>Imagine an AI assistant produces a polished business report with financial figures, convincing explanations and sensible-sounding recommendations. Some of the figures are wrong. If nobody checks, the business makes a poor decision based on a confident-looking document.</p>
<p>The most effective AI users are not the ones who accept every answer. They know how to question, check, verify and improve what the AI produces.</p>

<div class="box think"><span class="tag">A habit to build</span>
<h4>The CHECK routine</h4>
<ul>
<li><strong>C · Claims.</strong> What factual claims does the output make? Mark names, numbers, dates, quotations and references.</li>
<li><strong>H · Head to a source.</strong> Verify each important claim in an original, reliable source, not another AI answer.</li>
<li><strong>E · Errors and omissions.</strong> What might be missing, outdated or one-sided?</li>
<li><strong>C · Context.</strong> Is it right for your situation, audience, country and law?</li>
<li><strong>K · Keep responsibility.</strong> You are accountable for what you use, send or submit.</li>
</ul>
</div>

/* glossary popover */
const pop = $('#pop');
let popFor = null;
function showPop(el){
  const g = GLOSSARY[el.dataset.g]; if (!g) return;
  pop.innerHTML = `<b>${esc(g.t)}</b>${esc(g.d)}`;
  pop.hidden = false; popFor = el;
  const r = el.getBoundingClientRect();
  const w = Math.min(300, document.documentElement.clientWidth - 32);
  pop.style.maxWidth = w + 'px';
  let left = r.left + window.scrollX;
  left = Math.max(16 + window.scrollX, Math.min(left, window.scrollX + document.documentElement.clientWidth - w - 16));
  pop.style.left = left + 'px';
  pop.style.top = (r.bottom + window.scrollY + 8) + 'px';
}
function hidePop(){ pop.hidden = true; popFor = null; }
document.addEventListener('click', e => {
  const g = e.target.closest('.g');
  if (g) { if (popFor === g) hidePop(); else showPop(g); return; }
  if (!e.target.closest('#pop')) hidePop();
});
document.addEventListener('keydown', e => { const g = e.target.closest && e.target.closest('.g'); if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); showPop(g); } });

  }).join('');
  const wq = w => `<div class="wq"><p class="qt">${esc(w.q)} <span style="color:var(--muted);font-weight:400">(${w.max} marks)</span></p>

  main.innerHTML = `<div class="col">
    <div class="eyebrow">Chapter 01 · Assessment</div>
    <h1>Knowledge assessment</h1>
    <p class="lede">30 marks. The pass mark is 70% (21 marks).</p>
    <p style="font-family:var(--f-ui);font-size:15px;color:var(--ink-2)">Section A is marked automatically. For Sections B and C, write your answer, open the marking guide, and award yourself a mark honestly. Your answers are saved in this browser as you type.</p>

    <section class="sec"><div class="sec-h"><h2>Section B · Short answers</h2><span>10 marks</span></div>${ASSESS_WRITTEN.filter(w=>w.sec==='B').map(wq).join('')}</section>
    <section class="sec"><div class="sec-h"><h2>Section C · Practical application</h2><span>10 marks</span></div>
      <div class="scenario"><strong>Scenario.</strong> You manage a small business that receives many customer enquiries by email. You want to introduce AI to help employees manage them.</div>
      ${ASSESS_WRITTEN.filter(w=>w.sec==='C').map(wq).join('')}</section>
    <div class="row"><button class="btn btn-primary" id="markBtn" type="button">Calculate my result</button>${A.result ? '<button class="btn btn-ghost" id="retryBtn" type="button">Clear answers and retry</button>' : ''}</div>
    <div id="resultBox"></div>
    ${foot()}</div>`;
  $$('input[type=radio]', main).forEach(r => r.addEventListener('change', () => { A.mcq[r.name.slice(1)] = +r.value; save(); }));
  let tmr; $$('textarea[data-w]', main).forEach(t => t.addEventListener('input', () => { A.text[t.dataset.w] = t.value; clearTimeout(tmr); tmr = setTimeout(save, 300); }));
  $$('select[data-s]', main).forEach(s => s.addEventListener('change', () => { if (s.value === '') delete A.self[s.dataset.s]; else A.self[s.dataset.s] = +s.value; save(); }));
  $('#markBtn').addEventListener('click', () => {
    const mcq = ASSESS_MCQ.reduce((n, m, i) => n + (A.mcq[i] === m.a ? 1 : 0), 0);
    const unmarked = ASSESS_WRITTEN.filter(w => A.self[w.id] === undefined).length;

    A.result = {mcq, b, c, total, pass: total >= 21, unmarked, date: new Date().toISOString().slice(0,10)};

function enhance(root, lessonId){
  $$('.g', root).forEach(g => { g.setAttribute('role','button'); g.setAttribute('tabindex','0'); g.setAttribute('aria-label', g.textContent + ', show definition'); });
  const c = $('[data-check]', root); if (c) renderCheck(c, lessonId);
  $$('[data-widget]', root).forEach(w => ({timeline, 'is-it-ai':sortLab, 'catch-errors':errLab, 'ai-day':dayLab})[w.dataset.widget](w));
}

function renderCheck(el, lessonId){
  const qs = CHECKS[lessonId] || [];
  el.className = 'check';
  el.innerHTML = `<div class="eyebrow">Lesson ${lessonId.replace('-','.')}</div><h2>Check your understanding</h2>` + qs.map((q, qi) => {
    const key = lessonId + ':' + qi;
    return `<fieldset class="q" data-key="${key}"><legend>${esc(q.q)}</legend><div class="opts">${q.o.map((o, oi) => `<button type="button" class="opt" data-oi="${oi}"><span class="l">${L(oi)}</span><span>${esc(o)}</span></button>`).join('')}</div><p class="fb" aria-live="polite"></p></fieldset>`;
  }).join('');
  $$('.q', el).forEach((fs, qi) => {
    const q = qs[qi];
    const paint = oi => {
      $$('.opt', fs).forEach(b => b.classList.remove('right','wrong'));
      const fb = $('.fb', fs);
      if (oi === undefined) { fb.textContent=''; fb.className='fb'; return; }
      $$('.opt', fs)[oi].classList.add(oi === q.a ? 'right' : 'wrong');
      if (oi !== q.a) $$('.opt', fs)[q.a].classList.add('right');
      fb.className = 'fb ' + (oi === q.a ? 'ok' : 'no');
      fb.innerHTML = `<strong>${oi === q.a ? 'Correct.' : 'Not quite. The answer is ' + L(q.a) + '.'}</strong> <span>${esc(q.x)}</span>`;
    };
    paint(S.checks[fs.dataset.key]);
    $$('.opt', fs).forEach(b => b.addEventListener('click', () => { const oi = +b.dataset.oi; S.checks[fs.dataset.key] = oi; save(); paint(oi); }));
  });
}

  const draw = () => {
    el.innerHTML = `<div class="tl-filters" role="group" aria-label="Filter the timeline">${[['all','All'],['symbolic','Rules & search'],['learning','Learning from data'],['winter','AI winters']].map(([k,t]) => `<button type="button" data-f="${k}" aria-pressed="${f===k}">${t}</button>`).join('')}</div>
    <ol class="tl">${TIMELINE.filter(e => f==='all' || e.k.includes(f)).map(e => `<li class="${e.k.includes('winter')?'winter':''} ${e.k[0]==='symbolic'?'symbolic':''}"><div class="yr">${esc(e.y)}</div><div class="ev-body"><b>${esc(e.t)}</b>${esc(e.d)}<div class="kinds">${e.k.map(k => `<span>${KIND_LABEL[k]}</span>`).join('')}</div></div></li>`).join('')}</ol>`;
    $$('[data-f]', el).forEach(b => b.addEventListener('click', () => { f = b.dataset.f; draw(); }));
  };
  draw();
}

function sortLab(el){
  const opts = [['ai','AI'],['no','Not AI'],['dep','It depends']];
  const draw = () => {
    const answered = SORT_ITEMS.filter((_, i) => S.sort[i]).length;
    const right = SORT_ITEMS.filter((it, i) => S.sort[i] === it.a).length;
    el.className = 'lab';
    el.innerHTML = `<div class="lab-head"><div class="eyebrow">Lab · 10 minutes</div><h3>Is it AI?</h3><p>Sort each system. Use the OECD test from Lesson 1.2: does it <em>infer</em> its output, or follow a fixed rule? Feedback appears as you choose.</p></div>
    <div class="lab-body"><div class="sort-list">${SORT_ITEMS.map((it, i) => {
      const v = S.sort[i]; const st = v ? (v === it.a ? 'ok' : 'no') : '';
      return `<div class="sort-item ${st}"><span class="what">${esc(it.w)}</span><span class="seg" role="group" aria-label="${esc(it.w)}">${opts.map(([k,t]) => `<button type="button" data-i="${i}" data-v="${k}" aria-pressed="${v===k}">${t}</button>`).join('')}</span>${v ? `<span class="why"><strong style="color:var(--${v===it.a?'sage':'rose'})">${v===it.a?'Yes.':'Think again. Answer: ' + opts.find(o=>o[0]===it.a)[1] + '.'}</strong> ${esc(it.y)}</span>` : ''}</div>`;
    }).join('')}</div></div>
    <div class="lab-foot"><span class="score">${right} / ${SORT_ITEMS.length} correct</span><span style="color:var(--muted)">${answered} answered</span>${answered ? '<button type="button" class="chip-btn" data-reset>Start again</button>' : ''}</div>`;
    $$('[data-v]', el).forEach(b => b.addEventListener('click', () => { S.sort[b.dataset.i] = b.dataset.v; save(); draw(); }));
    const r = $('[data-reset]', el); if (r) r.addEventListener('click', () => { S.sort = {}; save(); draw(); });
  };
  draw();
}

function errLab(el){
  const draw = () => {
    const chk = S.sentChecked;
    const found = SENTENCES.filter((s, i) => !!S.sent[i] === s.err).length;
    el.className = 'lab';
    el.innerHTML = `<div class="lab-head"><div class="eyebrow">Lab · CHECK in practice</div><h3>Catch the errors</h3><p>This paragraph was written for this exercise in the style of an AI answer. It contains deliberate errors. Select every sentence you think is wrong or unsupported, then check.</p></div>
    <div class="lab-body"><div class="sent-list">${SENTENCES.map((s, i) => {
      const sel = !!S.sent[i]; let cls = '';
      if (chk) cls = sel === s.err ? 'ok' : 'no';
      return `<button type="button" class="sent ${cls}" data-i="${i}" aria-pressed="${sel}" ${chk?'disabled':''}>${esc(s.s)}${chk ? `<small>${sel===s.err?'✓':'✗'} ${esc(s.y)}</small>` : ''}</button>`;
    }).join('')}</div></div>
    <div class="lab-foot">${chk ? `<span class="score">${found} / ${SENTENCES.length} sentences judged correctly</span><button type="button" class="chip-btn" data-again>Try again</button>` : `<button type="button" class="btn btn-primary" data-check-err>Check my answers</button><span style="color:var(--muted)">${Object.values(S.sent).filter(Boolean).length} selected</span>`}</div>`;
    $$('.sent', el).forEach(b => b.addEventListener('click', () => { const i = b.dataset.i; S.sent[i] = !S.sent[i]; save(); draw(); }));
    const c = $('[data-check-err]', el); if (c) c.addEventListener('click', () => { S.sentChecked = true; save(); draw(); });
    const a = $('[data-again]', el); if (a) a.addEventListener('click', () => { S.sent = {}; S.sentChecked = false; save(); draw(); });
  };
  draw();
}

function dayLab(el){
  const draw = () => {
    const picked = DAY_ITEMS.filter((_, i) => S.day[i]);
    const kinds = {}; picked.forEach(p => kinds[p.k] = (kinds[p.k] || 0) + 1);
    el.className = 'lab';
    el.innerHTML = `<div class="lab-head"><div class="eyebrow">Lab · 3 minutes</div><h3>Your AI day</h3><p>Tick everything you did in the last 24 hours. Each one involves machine learning behind the scenes.</p></div>
    <div class="lab-body"><div class="day-grid">${DAY_ITEMS.map((d, i) => `<label for="day-${i}"><input type="checkbox" id="day-${i}" data-i="${i}" ${S.day[i]?'checked':''}><span>${esc(d.w)}<small>${d.k}</small></span></label>`).join('')}</div></div>
    <div class="lab-foot"><div><span class="score">${picked.length} AI-powered interaction${picked.length===1?'':'s'}</span> in your day${picked.length ? '<div class="mix">' + Object.entries(kinds).map(([k,n]) => `<span>${k} × ${n}</span>`).join('') + '</div>' : ''}</div></div>`;
    $$('input', el).forEach(c => c.addEventListener('change', () => { S.day[c.dataset.i] = c.checked; save(); draw(); }));
  };
  draw();
}

/* =====================================================================
   ROUTER (plain #name hashes)
   ===================================================================== */
function route(){
  const h = location.hash.slice(1) || 'home';
  let m, key = h;
  hidePop(); setMenu(false);
  if (h === 'chapter-1') renderChapter();
  else if ((m = h.match(/^lesson-(1-[1-8])$/))) renderLesson(m[1]);
  else if (h === 'summary-1') renderSummary();
  else if (h === 'assessment-1') renderAssessment();
  else if (h === 'glossary') renderGlossary();
  else if (h === 'references') renderReferences();
  else { key = 'home'; renderHome(); }
  renderNav(key);
  const t = $('h1', main);
  document.title = (key === 'home' ? '' : (t ? t.textContent + ' · ' : '')) + 'AI Foundations Handbook';
  window.scrollTo({top:0, left:0, behavior:'instant'});
  main.focus({preventScroll:true});
}
window.addEventListener('hashchange', route);
setTheme(S.theme || 'system');
route();
</script>

</body>
